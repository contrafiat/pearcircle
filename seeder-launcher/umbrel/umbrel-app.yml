releaseNotes: |
  New Features

    - **Back up your circles to PeerLoom Seeder.** PeerLoom Seeder is one seeder app for all your PeerLoom apps. Pair it with PearCircle by scanning its QR code. It keeps a copy of your circles so members can catch up even when nobody else's phone is online. Your circles stay private: the seeder can't read names or places.
    - **Choose which circles to back up.** Each circle has its own switch. Any member can add a seeder to a circle. Only the person who added it, the owner or a co-owner can remove it.
    - **Already have a PearCircle Seeder?** It keeps working. You can keep using it, switch to PeerLoom Seeder or use both.

  Improvements

    - **One place for seeders.** Settings now shows all your seeders in one list. The same Scan button pairs either kind of seeder.
    - **Clearer feedback.** Pairing with a seeder or stopping one now shows a progress screen, then closes when it's done. If something goes wrong you see what happened, and you never get a "Paired" message for a pairing that failed.
    - **Seeders that sit behind a home router now connect.** If a direct connection fails, PearCircle reaches the seeder through the relay.
    - **Faster setup.** Seeders that are offline no longer slow things down.

  Bug Fixes

    - Seeders you stopped using no longer stay in your list.
    - When you stop using a seeder, it keeps your backup for 7 days in case another member still uses it.
    - The relay switch in Settings sometimes didn't appear after the app started. It now always shows.
    - Desktop seeder downloads are back on the latest release, and the seeder's update check no longer offers an older version
